name: flow
# The flow gate. It runs from the BASE branch (pull_request_target, issue_comment) and only READS the PR through
# the API, so a PR can't change the code or the config that judges it. Never check out or run the PR's code here.
# Its result is the "flow" check run: make that a required check, with GitHub Actions as its source.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created, edited, deleted]
  # Re-run when CI finishes, so its checks can count as evidence. /flow:install lists this repo's CI workflow names.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  merge_group:
permissions:
  contents: read
  checks: write
  pull-requests: write
  issues: write
jobs:
  flow-gate:
    if: github.event_name != 'issue_comment' || (github.event.issue.pull_request && github.event.comment.user.type != 'Bot' && contains(github.event.comment.body, '/flow'))
    # Job-level, so a comment run that the `if` skips never queues behind or cancels a real one. Queue, never cancel:
    # a cancelled gate job turns the PR's check rollup red and can leave the dashboard half-updated; the newest queued
    # run always judges the latest state.
    concurrency:
      group: flow-${{ github.event.pull_request.number || github.event.issue.number || github.event.workflow_run.pull_requests[0].number || github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The base branch's gate code: the default for pull_request_target and issue_comment; the queue's base for merge_group.
          ref: ${{ github.event.merge_group.base_sha || '' }}
          sparse-checkout: .github/flow
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .github/flow/flow.mjs check --post
        env:
          GITHUB_TOKEN: ${{ github.token }}
